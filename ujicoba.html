<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AREK AI MURID JATIM 2025</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a0a0a;
      color: #fff;
    }

    /* ===== HEADER SECTION ===== */
    .header {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Overlay gelap agar teks lebih kontras */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    /* Teks utama di tengah */
    .hero-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
    }

    .hero-text h1 {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 700;
      background: linear-gradient(90deg, #00b4d8, #48cae4, #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      animation: glow 3s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00b4d8; }
      to { text-shadow: 0 0 25px #48cae4; }
    }

    /* Responsif */
    @media (max-width: 768px) {
      .hero-text h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <!-- Gambar slide (bisa diganti dengan gambar AI lainnya) -->
    <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1920&q=80" class="slide active" alt="AI background 1">
    <img src="https://images.unsplash.com/photo-1677442136603-9f21c1b54f25?auto=format&fit=crop&w=1920&q=80" class="slide" alt="AI background 2">
    <img src="https://images.unsplash.com/photo-1677442136040-46a01c068ba0?auto=format&fit=crop&w=1920&q=80" class="slide" alt="AI background 3">

    <div class="overlay"></div>

    <div class="hero-text">
      <h1>AREK AI MURID JATIM 2025</h1>
    </div>
  </header>

  <script>
    // Script untuk mengganti gambar otomatis
    const slides = document.querySelectorAll(".slide");
    let current = 0;

    function changeSlide() {
      slides[current].classList.remove("active");
      current = (current + 1) % slides.length;
      slides[current].classList.add("active");
    }

    setInterval(changeSlide, 5000); // ganti gambar setiap 5 detik
  </script>
</body>
</html>
